; ESP8266 lamps: WLED's 160 MHz build with the Force Off usermod, and without the features these lamps do not use,
; so they leave the heap to MQTT and effects.

[platformio]
default_envs = esp8266_lean

[env:esp8266_lean]
extends = env:nodemcuv2
board_build.f_cpu = 160000000L
build_flags = ${common.build_flags} ${esp8266.build_flags} -D WLED_RELEASE_NAME=\"ESP8266_lean\"
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ADALIGHT
custom_usermods = https://github.com/daveyijzermans/wled-usermod-force-off.git#main
  https://github.com/daveyijzermans/wled-usermod-mqtt-diag.git#main
